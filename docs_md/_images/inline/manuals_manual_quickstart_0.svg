<svg id="sdk-tree" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="sdk-title sdk-desc" style="width:100%;height:auto;display:block">
<title id="sdk-title">Cinema 4D Python SDK folder structure</title>
<desc id="sdk-desc">A themed file browser. The SDK root contains agent guidance, documentation, runnable examples, an empty user-project folder, and workspace files.</desc>
<style>
#sdk-tree{color:var(--color-text,#4d4d4d);font-family:var(--font-family-sans,'Roboto',Arial,sans-serif);font-size:14px}
#sdk-tree text{fill:currentColor}
#sdk-tree .mono{font-family:var(--font-family-monospace,monospace)}
#sdk-tree .muted{opacity:.72}
#sdk-tree .line{fill:none;stroke:currentColor;stroke-opacity:.24;stroke-width:1.4}
#sdk-tree .frame{fill:none;stroke:currentColor;stroke-opacity:.28;stroke-width:1.4}
#sdk-tree .header{fill:currentColor;fill-opacity:.045}
#sdk-tree .rootrow{fill:currentColor;fill-opacity:.055}
#sdk-tree .folder{fill:currentColor;fill-opacity:.12;stroke:currentColor;stroke-opacity:.68;stroke-width:1.2}
#sdk-tree .file{fill:currentColor;fill-opacity:.48;stroke:currentColor;stroke-opacity:.72;stroke-width:1.1}
#sdk-tree .filefold{fill:none;stroke:currentColor;stroke-opacity:.72;stroke-width:1.1}
</style>

