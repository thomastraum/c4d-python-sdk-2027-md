<svg class="ca" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="ca-title ca-desc" style="width:100%;height:auto;max-width:960px;display:block;margin:0 auto">
<title id="ca-title">Generator caches</title>
<desc id="ca-desc">A Cube generator with a Bend deformer as its child stores its output in a polygon object cache, which is reached with GetCache. The deformed result is a second polygon object, reached with GetDeformCache of the cache. An Array generator stores a Null object as its cache, which contains the clones. Each clone is a generator with a polygon object cache of its own.</desc>
<style>
.ca{color:var(--color-text,#4d4d4d);font-family:var(--font-family-sans,'Roboto',Arial,sans-serif);font-size:12px}
.ca text{fill:currentColor}
.ca .t{font-weight:500;font-size:13px}
.ca .s{font-size:11px}
.ca .n{font-size:11px;opacity:.7}
.ca .line{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:1.3}
.ca .cachel{fill:none;stroke:hsl(190 65% 42%);stroke-width:1.6;stroke-dasharray:5 4}
.ca .panel{fill:currentColor;fill-opacity:.03;stroke:currentColor;stroke-opacity:.25;stroke-dasharray:5 4}
.ca .node{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.4}
.ca .gen{fill:hsl(215 70% 55% / .18);stroke:hsl(215 60% 55%)}
.ca .cache{fill:hsl(190 70% 45% / .18);stroke:hsl(190 65% 42%)}
.ca .cl{fill:hsl(190 65% 42%)}
</style>
<defs>
<marker id="ca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="hsl(190 65% 42%)"/></marker>
</defs>

<!-- Generator with a deformer -->
<rect class="panel" x="20" y="16" width="450" height="300" rx="10"/>
<text class="t" x="36" y="38">A generator with a deformer</text>

<rect class="gen" x="40" y="70" width="120" height="30" rx="4"/>
<text class="s" x="100" y="89" text-anchor="middle">Cube  generator</text>
<path class="line" d="M50 100V140H60"/>
<rect class="node" x="60" y="125" width="120" height="30" rx="4"/>
<text class="s" x="120" y="144" text-anchor="middle">Bend  deformer</text>

<path class="cachel" d="M160 85H248" marker-end="url(#ca-arrow)"/>
<text class="s cl" x="204" y="78" text-anchor="middle">GetCache()</text>
<rect class="cache" x="250" y="70" width="150" height="30" rx="4"/>
<text class="s" x="325" y="89" text-anchor="middle">Polygon  cache</text>

<path class="cachel" d="M325 100V168" marker-end="url(#ca-arrow)"/>
<text class="s cl" x="335" y="138">GetDeformCache()</text>
<rect class="cache" x="250" y="170" width="150" height="30" rx="4"/>
<text class="s" x="325" y="189" text-anchor="middle">Polygon  deform cache</text>

<text class="n" x="40" y="240">The cache holds the geometry of the generator. The deformer does not</text>
<text class="n" x="40" y="256">change it, but adds a second object, the deformed copy.</text>
<text class="n" x="40" y="280">GetCacheParent() leads from a cache back to its generator.</text>

<!-- Generator that returns a hierarchy -->
<rect class="panel" x="490" y="16" width="450" height="300" rx="10"/>
<text class="t" x="506" y="38">A generator that returns a hierarchy</text>

<rect class="gen" x="510" y="70" width="110" height="30" rx="4"/>
<text class="s" x="565" y="89" text-anchor="middle">Array  generator</text>
<path class="line" d="M520 100V140H530"/>
<rect class="node" x="530" y="125" width="110" height="30" rx="4"/>
<text class="s" x="585" y="144" text-anchor="middle">Cylinder  input</text>

<path class="cachel" d="M620 85H698" marker-end="url(#ca-arrow)"/>
<text class="s cl" x="659" y="78" text-anchor="middle">GetCache()</text>
<rect class="cache" x="700" y="70" width="100" height="30" rx="4"/>
<text class="s" x="750" y="89" text-anchor="middle">Null  cache</text>

<path class="line" d="M712 100V190H725M712 140H725"/>
<rect class="gen" x="725" y="125" width="100" height="30" rx="4"/>
<text class="s" x="775" y="144" text-anchor="middle">Cylinder.1</text>
<rect class="gen" x="725" y="175" width="100" height="30" rx="4"/>
<text class="s" x="775" y="194" text-anchor="middle">Cylinder.2</text>

<path class="cachel" d="M825 140H858" marker-end="url(#ca-arrow)"/>
<rect class="cache" x="860" y="125" width="70" height="30" rx="4"/>
<text class="s" x="895" y="144" text-anchor="middle">Polygon</text>
<path class="cachel" d="M825 190H858" marker-end="url(#ca-arrow)"/>
<rect class="cache" x="860" y="175" width="70" height="30" rx="4"/>
<text class="s" x="895" y="194" text-anchor="middle">Polygon</text>

<text class="n" x="510" y="240">The clones only exist in the cache. Each of them is a generator</text>
<text class="n" x="510" y="256">with a cache of its own, and caches can be nested this deeply.</text>
<text class="n" x="510" y="280">The input objects stay what they are, e.g., in the Object Manager.</text>

<!-- Legend -->
<rect class="gen" x="20" y="340" width="14" height="10" rx="2"/><text class="n" x="42" y="349">Generator in the scene</text>
<rect class="node" x="190" y="340" width="14" height="10" rx="2"/><text class="n" x="212" y="349">Other node in the scene</text>
<rect class="cache" x="370" y="340" width="14" height="10" rx="2"/><text class="n" x="392" y="349">Cache, not part of the scene</text>
<path class="line" d="M580 345h22"/><text class="n" x="610" y="349">Hierarchy</text>
<path class="cachel" d="M700 345h22"/><text class="n" x="730" y="349">Cache relation</text>
</svg>