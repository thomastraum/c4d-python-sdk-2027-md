<svg class="ss" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" role="img" aria-labelledby="ss-title ss-desc" style="width:100%;height:auto;max-width:960px;display:block;margin:0 auto">
<title id="ss-title">The structure of a Cinema 4D scene</title>
<desc id="ss-desc">A document owns several branches, each rooted in a list head: Objects, Materials, Render Settings, Layers, Scene Hooks. The Objects branch holds the object hierarchy A with B, C, D, E and F, and G with H. Nodes can own branches too: the object B owns a Tags branch with a Phong tag and a Tracks branch with a position track, which owns a Sequences branch with a curve. A material owns a Shaders branch. A generator additionally stores its output as a cache that is not part of a branch.</desc>
<style>
.ss{color:var(--color-text,#4d4d4d);font-family:var(--font-family-sans,'Roboto',Arial,sans-serif);font-size:12px}
.ss text{fill:currentColor}
.ss .t{font-weight:500;font-size:13px}
.ss .s{font-size:11px}
.ss .n{font-size:11px;opacity:.7}
.ss .line{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:1.3}
.ss .own{fill:none;stroke:hsl(35 80% 50%);stroke-width:1.6}
.ss .link{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-dasharray:2 4;stroke-width:1.3}
.ss .cachel{fill:none;stroke:hsl(190 65% 42%);stroke-width:1.5;stroke-dasharray:5 4}
.ss .panel{fill:currentColor;fill-opacity:.03;stroke:currentColor;stroke-opacity:.25;stroke-dasharray:5 4}
.ss .doc{fill:hsl(215 70% 55% / .18);stroke:hsl(215 60% 55%)}
.ss .head{fill:hsl(35 85% 55% / .2);stroke:hsl(35 80% 50%)}
.ss .node{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.4}
.ss .cache{fill:hsl(190 70% 45% / .18);stroke:hsl(190 65% 42%)}
</style>
<defs>
<marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="hsl(190 65% 42%)"/></marker>
</defs>

<!-- Document -->
<rect class="doc" x="20" y="315" width="110" height="44" rx="6"/>
<text class="t" x="75" y="341" text-anchor="middle">BaseDocument</text>

<!-- Fan-out from the document to its branch heads -->
<path class="own" d="M130 337L170 56M130 337L170 286M130 337L170 404M130 337L170 446M130 337L170 514M130 337L170 618"/>

<!-- Branch heads -->
<rect class="head" x="170" y="41" width="150" height="30" rx="15"/>
<text class="s" x="245" y="60" text-anchor="middle">Objects (Obase)</text>
<rect class="head" x="170" y="271" width="150" height="30" rx="15"/>
<text class="s" x="245" y="290" text-anchor="middle">Materials (Mbase)</text>
<rect class="head" x="170" y="389" width="150" height="30" rx="15"/>
<text class="s" x="245" y="408" text-anchor="middle">Render Settings (Rbase)</text>
<rect class="head" x="170" y="431" width="150" height="30" rx="15"/>
<text class="s" x="245" y="450" text-anchor="middle">Layers (Olayer)</text>
<rect class="head" x="170" y="499" width="150" height="30" rx="15"/>
<text class="s" x="245" y="518" text-anchor="middle">Scene Hooks (SHplugin)</text>
<rect class="head" x="170" y="603" width="150" height="30" rx="15"/>
<text class="s" x="245" y="622" text-anchor="middle">...</text>

<!-- Branch contents: every branch is a hierarchy, most are flat lists. Tree lines first -->
<path class="line" d="M320 56H340V212M340 56H350M340 212H350"/>
<path class="line" d="M360 67V82H368M360 223V238H368M378 93V186M378 108H386M378 134H386M378 186H386M396 145V160H404"/>
<path class="line" d="M320 286H340M340 286V364M340 286H350M340 312H350M340 338H350M340 364H350"/>
<path class="line" d="M320 404H350"/>
<path class="line" d="M320 446H340M340 446V472M340 446H350M340 472H350"/>
<path class="line" d="M320 514H340M340 514V566M340 514H350M340 540H350M340 566H350"/>

<rect class="node" x="350" y="45" width="100" height="22" rx="4"/><text class="s" x="358" y="60">A  Null</text>
<rect class="node" x="368" y="71" width="100" height="22" rx="4"/><text class="s" x="376" y="86">B  Cube</text>
<rect class="node" x="386" y="97" width="100" height="22" rx="4"/><text class="s" x="394" y="112">C  Sphere</text>
<rect class="node" x="386" y="123" width="100" height="22" rx="4"/><text class="s" x="394" y="138">D  Cone</text>
<rect class="node" x="404" y="149" width="100" height="22" rx="4"/><text class="s" x="412" y="164">E  Sphere</text>
<rect class="node" x="386" y="175" width="100" height="22" rx="4"/><text class="s" x="394" y="190">F  Cylinder</text>
<rect class="node" x="350" y="201" width="100" height="22" rx="4"/><text class="s" x="358" y="216">G  Null</text>
<rect class="node" x="368" y="227" width="100" height="22" rx="4"/><text class="s" x="376" y="242">H  Null</text>

<rect class="node" x="350" y="275" width="100" height="22" rx="4"/><text class="s" x="358" y="290">Mat</text>
<rect class="node" x="350" y="301" width="100" height="22" rx="4"/><text class="s" x="358" y="316">Mat.1</text>
<rect class="node" x="350" y="327" width="100" height="22" rx="4"/><text class="s" x="358" y="342">Mat.2</text>
<text class="s" x="358" y="368">...</text>

<rect class="node" x="350" y="393" width="130" height="22" rx="4"/><text class="s" x="358" y="408">My Render Setting</text>

<rect class="node" x="350" y="435" width="100" height="22" rx="4"/><text class="s" x="358" y="450">Layer</text>
<rect class="node" x="350" y="461" width="100" height="22" rx="4"/><text class="s" x="358" y="476">Layer.1</text>

<rect class="node" x="350" y="503" width="100" height="22" rx="4"/><text class="s" x="358" y="518">STHOOK</text>
<rect class="node" x="350" y="529" width="100" height="22" rx="4"/><text class="s" x="358" y="544">Take Hook</text>
<text class="s" x="358" y="570">... (dozens)</text>
<!-- Right panel: nodes own branches too -->
<rect class="panel" x="610" y="16" width="330" height="380" rx="10"/>
<text class="t" x="626" y="38">Nodes own branches, too</text>

<rect class="node" x="630" y="60" width="100" height="30" rx="4"/>
<text class="s" x="680" y="79" text-anchor="middle">B  Cube</text>
<path class="link" d="M468 82H590V75H630"/>
<path class="link" d="M450 286H590V315H630"/>

<path class="own" d="M645 90V164M645 120H660M645 164H660"/>
<rect class="head" x="660" y="105" width="75" height="28" rx="14"/>
<text class="s" x="697" y="123" text-anchor="middle">Tags</text>
<path class="line" d="M735 119H750"/>
<rect class="node" x="750" y="107" width="90" height="24" rx="4"/>
<text class="s" x="795" y="123" text-anchor="middle">Phong tag</text>

<rect class="head" x="660" y="150" width="75" height="28" rx="14"/>
<text class="s" x="697" y="168" text-anchor="middle">Tracks</text>
<path class="line" d="M735 164H750"/>
<rect class="node" x="750" y="152" width="90" height="24" rx="4"/>
<text class="s" x="795" y="168" text-anchor="middle">Position.X</text>

<path class="own" d="M795 176V208H810"/>
<rect class="head" x="810" y="194" width="85" height="28" rx="14"/>
<text class="s" x="852" y="212" text-anchor="middle">Sequences</text>
<path class="line" d="M852 222V240"/>
<rect class="node" x="822" y="240" width="60" height="24" rx="4"/>
<text class="s" x="852" y="256" text-anchor="middle">CCurve</text>

<!-- Cache -->
<path class="cachel" d="M730 75H805" marker-end="url(#ss-arrow)"/>
<rect class="cache" x="805" y="60" width="120" height="30" rx="4"/>
<text class="s" x="865" y="79" text-anchor="middle">Polygon (cache)</text>
<text class="n" x="767" y="69" text-anchor="middle">GetCache()</text>

<!-- Material -->
<rect class="node" x="630" y="300" width="100" height="30" rx="4"/>
<text class="s" x="680" y="319" text-anchor="middle">Mat</text>
<path class="own" d="M645 330V364M645 364H660"/>
<rect class="head" x="660" y="350" width="75" height="28" rx="14"/>
<text class="s" x="697" y="368" text-anchor="middle">Shaders</text>
<path class="line" d="M735 364H750"/>
<rect class="node" x="750" y="352" width="70" height="24" rx="4"/>
<text class="s" x="785" y="368" text-anchor="middle">Noise</text>

<!-- Legend, valid for the whole diagram -->
<rect class="doc" x="20" y="668" width="14" height="10" rx="2"/><text class="n" x="42" y="677">Document</text>
<rect class="node" x="130" y="668" width="14" height="10" rx="2"/><text class="n" x="152" y="677">Node</text>
<rect class="head" x="210" y="668" width="14" height="10" rx="5"/><text class="n" x="232" y="677">GeListHead</text>
<path class="own" d="M330 673h18"/><text class="n" x="356" y="677">Owns a branch</text>
<path class="line" d="M460 673h18"/><text class="n" x="486" y="677">In the list</text>
<path class="cachel" d="M570 673h18"/><text class="n" x="596" y="677">Cache, not a branch</text>
<path class="link" d="M730 673h18"/><text class="n" x="756" y="677">Same node</text>
</svg>