<svg class="hr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="hr-title hr-desc" style="width:100%;height:auto;max-width:960px;display:block;margin:0 auto">
<title id="hr-title">A hierarchy is a set of linked nodes</title>
<desc id="hr-desc">The object hierarchy A with child B, B with children C, D and F, D with child E, and the sibling G with child H, drawn as nodes. Each node links to its first child with GetDown and to its next sibling with GetNext.</desc>
<style>
.hr{color:var(--color-text,#4d4d4d);font-family:var(--font-family-sans,'Roboto',Arial,sans-serif);font-size:12px}
.hr text{fill:currentColor}
.hr .t{font-weight:500;font-size:13px}
.hr .s{font-size:11px;opacity:.85}
.hr .n{font-size:11px;opacity:.7}
.hr .l{font-size:13px}
.hr .line{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-width:1}
.hr .wedge{fill:currentColor;fill-opacity:.65}
.hr .band{fill:currentColor;fill-opacity:.05}
.hr .node{fill:currentColor;fill-opacity:.07;stroke:currentColor;stroke-opacity:.4}
.hr .down{fill:none;stroke:hsl(215 60% 55%);stroke-width:1.8}
.hr .next{fill:none;stroke:hsl(150 50% 45%);stroke-width:1.8}
.hr .panel{fill:currentColor;fill-opacity:.03;stroke:currentColor;stroke-opacity:.25;stroke-dasharray:5 4}
</style>
<defs>
<marker id="hr-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="hsl(215 60% 55%)"/></marker>
<marker id="hr-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="hsl(150 50% 45%)"/></marker>
</defs>

<!-- Linked nodes -->
<rect class="node" x="60" y="30" width="70" height="34" rx="6"/><text class="t" x="95" y="52" text-anchor="middle">A</text>
<rect class="node" x="480" y="30" width="70" height="34" rx="6"/><text class="t" x="515" y="52" text-anchor="middle">G</text>
<rect class="node" x="60" y="130" width="70" height="34" rx="6"/><text class="t" x="95" y="152" text-anchor="middle">B</text>
<rect class="node" x="480" y="130" width="70" height="34" rx="6"/><text class="t" x="515" y="152" text-anchor="middle">H</text>
<rect class="node" x="60" y="230" width="70" height="34" rx="6"/><text class="t" x="95" y="252" text-anchor="middle">C</text>
<rect class="node" x="220" y="230" width="70" height="34" rx="6"/><text class="t" x="255" y="252" text-anchor="middle">D</text>
<rect class="node" x="380" y="230" width="70" height="34" rx="6"/><text class="t" x="415" y="252" text-anchor="middle">F</text>
<rect class="node" x="220" y="330" width="70" height="34" rx="6"/><text class="t" x="255" y="352" text-anchor="middle">E</text>

<!-- GetDown: first child -->
<path class="down" d="M95 64V128" marker-end="url(#hr-down)"/>
<path class="down" d="M95 164V228" marker-end="url(#hr-down)"/>
<path class="down" d="M255 264V328" marker-end="url(#hr-down)"/>
<path class="down" d="M515 64V128" marker-end="url(#hr-down)"/>

<!-- GetNext: next sibling -->
<path class="next" d="M130 47H478" marker-end="url(#hr-next)"/>
<path class="next" d="M130 247H218" marker-end="url(#hr-next)"/>
<path class="next" d="M290 247H378" marker-end="url(#hr-next)"/>

<text class="s" x="105" y="102">GetDown()</text>
<text class="s" x="300" y="40">GetNext()</text>

<!-- Legend -->
<path class="down" d="M60 392h30" marker-end="url(#hr-down)"/>
<text class="n" x="100" y="396">First child, GetDown()</text>
<path class="next" d="M250 392h30" marker-end="url(#hr-next)"/>
<text class="n" x="290" y="396">Next sibling, GetNext()</text>
<text class="n" x="460" y="396">The reverse links GetUp() and GetPred() are not drawn.</text>

<!-- The same hierarchy as in the Object Manager -->
<rect class="panel" x="610" y="16" width="330" height="268" rx="10"/>
<text class="t" x="626" y="38">As shown in the Object Manager</text>
<rect class="band" x="622" y="56" width="306" height="28" rx="4"/>
<rect class="band" x="622" y="112" width="306" height="28" rx="4"/>
<rect class="band" x="622" y="168" width="306" height="28" rx="4"/>
<rect class="band" x="622" y="224" width="306" height="28" rx="4"/>
<path class="line" d="M642 78V98H658M666 106V210M666 126H696M666 154H682M666 210H696M690 162V182H720M642 246V266H674"/>
<path class="wedge" d="M637.5 67.5H646.5L642 73.5z"/>
<text class="l" x="656" y="74.5">A</text>
<path class="wedge" d="M661.5 95.5H670.5L666 101.5z"/>
<text class="l" x="680" y="102.5">B</text>
<text class="l" x="704" y="130.5">C</text>
<path class="wedge" d="M685.5 151.5H694.5L690 157.5z"/>
<text class="l" x="704" y="158.5">D</text>
<text class="l" x="728" y="186.5">E</text>
<text class="l" x="704" y="214.5">F</text>
<path class="wedge" d="M637.5 235.5H646.5L642 241.5z"/>
<text class="l" x="656" y="242.5">G</text>
<text class="l" x="680" y="270.5">H</text>
</svg>